<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Fantasy Chess</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 40px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 16px;
    }
    p {
      font-size: 18px;
      color: #94a3b8;
    }
    .spinner {
      border: 4px solid #334155;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reset Password</h1>
    <div class="spinner"></div>
    <p id="message">Opening Fantasy Chess app...</p>
  </div>

  <script>
    // Wait for page to load
    window.addEventListener('load', function() {
      const hash = window.location.hash;
      const search = window.location.search;
      
      if (hash || search) {
        // Redirect to mobile app with the token
        const deepLink = 'fantasychess://reset-password' + hash + search;
        
        // Try to redirect
        window.location.href = deepLink;
        
        // Show fallback message after 2 seconds
        setTimeout(function() {
          document.getElementById('message').innerHTML = 
            'If the app didn\'t open automatically, please make sure Fantasy Chess is installed on your device.<br><br><a href="' + deepLink + '" style="color: #2563eb; text-decoration: underline;">Tap here to try again</a>';
        }, 2000);
      } else {
        document.getElementById('message').innerHTML = 
          'Invalid reset link. Please request a new password reset from the app.';
      }
    });
  </script>
</body>
</html>
